# Publishes the website/ folder to the gh-pages branch, which GitHub Pages serves.
name: Deploy website to GitHub Pages

on:
  push:
    branches: [website]
    paths: ["website/**"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deploy-site
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push website/ to gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git subtree split --prefix website -b site-build
          git push --force origin site-build:gh-pages
